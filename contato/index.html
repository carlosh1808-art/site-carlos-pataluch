  a.btn{

    gap:14px;
    text-decoration:none;
    background:var(--preto2);
    border:1px solid var(--linha);
    border-radius:8px;
    padding:16px 18px;
    color:var(--osso);
    font-size:14px;
    font-weight:500;
    letter-spacing:0.5px;
    transition:border-color 0.2s ease, transform 0.15s ease;
  }
  a.btn:active{
    transform:scale(0.98);
  }
  a.btn.principal{
    background:var(--latao);
    color:var(--preto);
    border-color:var(--latao);
    font-weight:600;
  }
  a.btn.principal .icon svg{stroke:var(--preto);}
  a.btn:not(.principal):hover{
    border-color:var(--latao-escuro);
  }
  .icon{
    width:20px;height:20px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .icon svg{width:100%;height:100%;stroke:var(--latao);fill:none;stroke-width:1.6;}

  .separador{

    font-size:10px;
    letter-spacing:2px;
    color:var(--cinza);
